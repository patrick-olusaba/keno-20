<svg viewBox="0 0 280 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Text gradients for 3D effect -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
    
    <!-- Main ball gradient -->
    <radialGradient id="mainBallGradient" cx="0.3" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="30%" stop-color="#e91e63"/>
      <stop offset="70%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#673ab7"/>
    </radialGradient>
    
    <!-- Small ball gradients - different colors -->
    <radialGradient id="ball1" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#26a69a"/>
    </radialGradient>
    
    <radialGradient id="ball2" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffa000"/>
    </radialGradient>
    
    <radialGradient id="ball3" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#4caf50"/>
    </radialGradient>
    
    <radialGradient id="ball4" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#f06292"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </radialGradient>
    
    <radialGradient id="ball6" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#ba68c8"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </radialGradient>
    
    <radialGradient id="ball7" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </radialGradient>
    
    <radialGradient id="ball8" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#66bb6a"/>
    </radialGradient>
    
    <!-- Ball glow -->
    <radialGradient id="ballGlow" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9c27b0" stop-opacity="0.1"/>
    </radialGradient>
    
    <!-- Number background -->
    <radialGradient id="numberBg" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f8ff"/>
    </radialGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Text shadow filter -->
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Small colorful balls scattered around -->
  <circle cx="15" cy="15" r="6" fill="url(#ball1)" filter="url(#dropShadow)">
    <animate attributeName="cy" values="15;18;15" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="15" cy="15" r="3" fill="url(#numberBg)" opacity="0.9"/>
  <text x="15" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#26a69a">5</text>
  
  <circle cx="35" cy="55" r="5" fill="url(#ball2)" filter="url(#dropShadow)">
    <animate attributeName="cy" values="55;52;55" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="35" cy="55" r="2.5" fill="url(#numberBg)" opacity="0.9"/>
  <text x="35" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" font-weight="bold" fill="#ffa000">12</text>
  
  <circle cx="165" cy="12" r="7" fill="url(#ball3)" filter="url(#dropShadow)">
    <animate attributeName="cy" values="12;15;12" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="165" cy="12" r="3.5" fill="url(#numberBg)" opacity="0.9"/>
  <text x="165" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#4caf50">7</text>
  
  <circle cx="180" cy="58" r="6" fill="url(#ball4)" filter="url(#dropShadow)">
    <animate attributeName="cy" values="58;55;58" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="58" r="3" fill="url(#numberBg)" opacity="0.9"/>
  <text x="180" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#e91e63">3</text>
  
  <circle cx="260" cy="15" r="5" fill="url(#ball5)" filter="url(#dropShadow)">
    <animate attributeName="cy" values="15;18;15" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="15" r="2.5" fill="url(#numberBg)" opacity="0.9"/>
  <text x="260" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" font-weight="bold" fill="#2196f3">18</text>
  
  <!-- Additional tiny balls -->
  <circle cx="55" cy="20" r="4" fill="url(#ball6)" filter="url(#dropShadow)">
    <animate attributeName="cy" values="20;17;20" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="55" cy="20" r="2" fill="url(#numberBg)" opacity="0.9"/>
  <text x="55" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="#9c27b0">9</text>
  
  <circle cx="120" cy="12" r="4" fill="url(#ball7)" filter="url(#dropShadow)">
    <animate attributeName="cy" values="12;15;12" dur="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="12" r="2" fill="url(#numberBg)" opacity="0.9"/>
  <text x="120" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="#ff9800">14</text>
  
  <circle cx="140" cy="60" r="4" fill="url(#ball8)" filter="url(#dropShadow)">
    <animate attributeName="cy" values="60;57;60" dur="2.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="60" r="2" fill="url(#numberBg)" opacity="0.9"/>
  <text x="140" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="#66bb6a">1</text>
  
  <circle cx="25" cy="35" r="3" fill="url(#ball1)" filter="url(#dropShadow)">
    <animate attributeName="cy" values="35;32;35" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="25" cy="35" r="1.5" fill="url(#numberBg)" opacity="0.9"/>
  <text x="25" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="3" font-weight="bold" fill="#26a69a">6</text>
  
  <circle cx="250" cy="50" r="3" fill="url(#ball4)" filter="url(#dropShadow)">
    <animate attributeName="cy" values="50;53;50" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="50" r="1.5" fill="url(#numberBg)" opacity="0.9"/>
  <text x="250" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="3" font-weight="bold" fill="#e91e63">11</text>
  
  <!-- Main keno ball -->
  <circle cx="220" cy="35" r="28" fill="url(#mainBallGradient)" filter="url(#dropShadow)"/>
  <circle cx="220" cy="35" r="26" fill="url(#ballGlow)"/>
  
  <!-- Number background circle -->
  <circle cx="220" cy="35" r="16" fill="url(#numberBg)" stroke="#ff6b35" stroke-width="1" opacity="0.9"/>
  
  <!-- Ball number -->
  <text x="220" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#673ab7">20</text>
  
  <!-- Main KENO text with colorful 3D effect -->
  <text x="65" y="38" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="url(#textGradient)" filter="url(#textShadow)" letter-spacing="2px">KENO</text>
  
  <!-- PRO subtitle -->
  <text x="67" y="58" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#textGradient)" filter="url(#textShadow)" letter-spacing="1px">PRO</text>
  
  <!-- Additional sparkle effects -->
  <circle cx="140" cy="25" r="1.5" fill="#ffd700" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="15" r="1" fill="#ff6b35" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="145" cy="50" r="1.2" fill="#4ecdc4" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>